[Settings]
; Main switch.
Enabled = true

; Shows probe lines and compact vehicle state text. In debug mode the INI is
; reread continuously and the manually driven player vehicle is also tested.
DebugMode = false
DebugTextScale = 0.25

; Gives eligible simplified traffic full vehicle physics.
UseRealPhysics = true

; Repairs vehicles which spawned partly inside invalid ground.
FixGroundStuck = true

; true limits RTF to STOP_FOR_CARS. false also protects faster driving styles.
OnlyInNormalDrivingStyle = false

; Maximum speed reduction at a strong steering angle, in percent. RTF also
; looks ahead through the vehicle's current path to begin braking before turns.
TurningSpeedDecrease = 55.0

; Multiplies only native ambient traffic speeds. Vehicles whose driving task
; specifies a speed keep that task speed unchanged. GTA III has no per-road
; speed multiplier.
TrafficCruiseSpeedMultiplier = 1.0

; Final physical intervention when ordinary braking cannot prevent impact:
; 0 = off, 1 = every mode, 2 = STOP_FOR_CARS only.
EmergencyVelocityIntervention = 1

; Three forward and three rear probes (one each on two-wheelers). FrontMultDist
; controls both forward and reverse probe length. Reverse length uses only
; actual reverse speed. SidesSpeedOffsetDiv controls outer-front-ray spread.
FrontMultDist = 50.0
SidesSpeedOffsetDiv = 70.0

; Probe endpoint ground validation.
CheckGroundHeight = 1.0
FinalGroundHeight = 0.7
HeightDiffLimit = 4.0
